version: "2"
linters:
  default: none
  # Deliberately NOT enabled (CI lint triage): ireturn, wrapcheck, tagliatelle,
  # nonamedreturns, mnd, inamedparam, nilnil — opinionated checks that fight this
  # library's interface-returning, snake_case-storage design.
  #
  # Also not enabled: musttag. It fires wherever a store marshals one of the
  # library's own wire structs (eventstore.Event, snapshotstore.AggregateSnapshot),
  # which are serialized whole and deliberately carry no json tags. Requiring tags
  # on every field of them is noise, not a finding.
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - forcetypeassert
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - goconst
    - gocritic
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - importas
    - ineffassign
    - interfacebloat
    - intrange
    - loggercheck
    - makezero
    - mirror
    - misspell
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - zerologlint
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files: skip low-value/noisy checks that don't apply to test code.
      # (staticcheck stays on in tests on purpose — it catches real bugs.)
      - linters:
          - copyloopvar
          - errcheck
          - forcetypeassert
          - gochecknoglobals
          - goconst
          - godot
          - godox
          - ineffassign
          - intrange
          - lll
          - nestif
          - paralleltest
          - prealloc
          - testpackage
        path: _test\.go
      # The storetest packages are test code that has to live in non-test files so
      # third-party backends can import the suites. thelper reads their clause
      # functions as helpers because each takes a *testing.T, but they are subtest
      # bodies: marking them t.Helper() would report every failure at the suite
      # runner's line instead of the assertion that failed, which is the one thing
      # a backend needs to see.
      - linters:
          - thelper
        path: storetest/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
